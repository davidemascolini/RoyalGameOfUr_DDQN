[project]
name = "rl"
version = "0.1.0"
description = "Reinforcement learning agents (n-step SARSA, Expected SARSA, Double DQN) for the Royal Game of Ur"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "torch>=2.11.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
# Only needed by ur_bridge.py / eval_optimal.py. The PyPI release has no `lut`
# module, so it must come from GitHub.
solved = [
    "royalur @ git+https://github.com/RoyalUr/RoyalUr-Python.git",
]
